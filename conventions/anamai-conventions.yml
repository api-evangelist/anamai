authentication:
  style: http-bearer
  model: >-
    Two-step. A long-lived API key (created in the Lab) is exchanged via
    POST /v1/auth/session-token for a short-lived session token; the session
    token establishes the client-side WebRTC persona connection. Server-to-server
    REST calls use the API key as a Bearer token.
