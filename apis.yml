aid: anamai
name: Anam.ai
description: >-
  Anam.ai is a real-time interactive AI avatar platform for building conversational video AI
  agents with photorealistic personas. Its proprietary CARA-4 avatar model streams over WebRTC
  with ultra-low latency (around 180ms) across 70+ languages, powering customer support, sales,
  tutoring, medical, and training use cases. The REST API (https://api.anam.ai/v1/) lets teams
  create and manage personas, avatars, voices, LLM configs, RAG knowledge groups, tools, share
  links, and sessions, and invite personas into Google Meet, Zoom, and Microsoft Teams calls via
  the Meetings API. Auth is a two-step Bearer flow (API key exchanged for a short-lived session
  token). Anam is HIPAA and SOC 2 certified. Surfaced as a Techstars portfolio company and
  enriched into the API Evangelist network.
