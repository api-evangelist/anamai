openapi: 3.2.0
info:
  title: Anam AI Personas API
  version: '1.0'
servers:
- url: https://api.anam.ai
  description: Anam API
security:
- BearerAuth: []
tags:
- name: Personas
paths:
  /v1/personas:
    get:
      description: Returns a list of all personas
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination
      - in: query
        name: perPage
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        description: Number of items per page
      - in: query
        name: search
        schema:
          type: string
        description: filter personas by name
      responses:
        '200':
          description: Successfully retrieved personas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonaSummary'
                  meta:
                    $ref: '#/components/schemas/Pagination'
              examples:
                default:
                  $ref: '#/components/examples/PersonaListResponse'
        '401':
          description: Unauthorized - Invalid or missing API key
        '403':
          description: Forbidden - API key lacks the required permission
        '500':
          description: Server error
      tags:
      - Personas
      operationId: listPersonas
      summary: list personas
      x-mint:
        metadata:
          title: list personas
        mcp:
          enabled: true
          name: list-personas
          description: Returns a list of all personas
    post:
      description: Create a new persona
      requestBody:
        description: Configuration for the new persona. `avatarId`, `voiceId`, and `llmId` are references to existing resources in your organization. `systemPrompt`, if provided, is merged into the `brain` field server-side. Setting `zeroDataRetention` to true requires the voice, LLM and `voiceDetectionOptions.sttProvider` to be ZDR-compatible and an enterprise plan.
        required: true
        content:
          application/json:
            examples:
              default:
                $ref: '#/components/examples/PersonaCreate'
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the persona
                  example: Cara
                description:
                  type: string
                  description: Description of the persona, for example "A helpful assistant". Does not affect the persona's behavior.
                avatarId:
                  type: string
                  description: The avatar to use.
                  example: 071b0286-4cce-4808-bee2-e642f1062de3
                avatarModel:
                  type: string
                  enum:
                  - cara-3
                  - cara-4
                  - cara-4-latest
                  description: Avatar model version. `cara-4` is pinned to a stable checkpoint; `cara-4-latest` tracks the newest Cara 4 checkpoint and may change between sessions.
                  example: cara-4
                voiceId:
                  type: string
                  description: The voice to use.
                  example: de23e340-1416-4dd8-977d-065a7ca11697
                llmId:
                  type: string
                  description: The LLM to use. To disable the LLM, use 'CUSTOMER_CLIENT_V1'.
                  example: a7cf662c-2ace-4de1-a21e-ef0fbf144bb7
                systemPrompt:
                  type: string
                  description: System prompt for the LLM
                  example: You are a helpful assistant
                skipGreeting:
                  type: boolean
                  description: Whether to skip the greeting message when starting a session with this persona.
                  example: false
                uninterruptibleGreeting:
                  type: boolean
                  description: When true, the greeting message cannot be interrupted by the user.
                  example: false
                initialMessage:
                  type: string
                  nullable: true
                  description: Custom first message the persona speaks to open the conversation. If empty or not provided, the persona generates its own greeting.
                  example: Hi there! I'm excited to chat with you today.
                zeroDataRetention:
                  type: boolean
                  description: When true, session data is not stored after the conversation ends
                  example: false
                maxSessionLengthSeconds:
                  type:
                  - integer
                  - 'null'
                  minimum: 60
                  maximum: 7200
                  description: Maximum length in seconds of every session with this persona. It can only shorten the plan's session limit, never extend it. Omit or send `null` for no persona limit.
                  example: 600
                voiceDetectionOptions:
                  $ref: '#/components/schemas/VoiceDetectionOptions'
                languageCode:
                  type: string
                  description: Supported ISO 639 language code override (including "yue" for Cantonese) for transcription, replaces organisation level settings and multilingual (default) mode.
                  example: en
                voiceGenerationOptions:
                  description: Configuration options for voice generation.
                  oneOf:
                  - $ref: '#/components/schemas/ElevenLabsV1VoiceGenerationOptions'
                  - $ref: '#/components/schemas/ElevenLabsV2VoiceGenerationOptions'
                  - $ref: '#/components/schemas/ElevenLabsV3VoiceGenerationOptions'
                  - $ref: '#/components/schemas/ElevenLabsV4VoiceGenerationOptions'
                  - $ref: '#/components/schemas/CartesiaSonic3VoiceGenerationOptions'
                  - $ref: '#/components/schemas/FishAudioVoiceGenerationOptions'
                toolIds:
                  type: array
                  items:
                    type: string
                  description: Array of tool IDs to attach to the persona.
                  example:
                  - tool-id-1
                  - tool-id-2
      responses:
        '201':
          description: Successfully created persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
              examples:
                default:
                  $ref: '#/components/examples/PersonaResponse'
        '400':
          description: Bad request - Invalid persona data, avatarModel not supported by avatar, or an `avatarId`, `voiceId`, `llmId` or `toolIds` entry that is missing, deleted or not available to your organization. `personaPreset` is no longer supported and is rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    description: Machine-readable reason, when one applies (for example `PERSONA_PRESET_UNSUPPORTED`).
              examples:
                presetUnsupported:
                  summary: A persona preset was sent
                  value:
                    error: personaPreset is no longer supported. Set avatarId and voiceId instead.
                    code: PERSONA_PRESET_UNSUPPORTED
                voiceNotFound:
                  summary: The voice was deleted or never existed
                  value:
                    error: Voice not found
        '401':
          description: Unauthorized - Invalid or missing API key
        '403':
          description: Forbidden - API key lacks the required permission
        '500':
          description: Server error
      tags:
      - Personas
      operationId: createPersona
      summary: create persona
      x-mint:
        metadata:
          title: create persona
        mcp:
          enabled: true
          name: create-persona
          description: Create a new persona
  /v1/personas/{id}:
    get:
      description: Returns a persona by id
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: Persona id
      responses:
        '200':
          description: Successfully retrieved persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
              examples:
                default:
                  $ref: '#/components/examples/PersonaResponse'
        '401':
          description: Unauthorized - Invalid or missing API key
        '403':
          description: Forbidden - API key lacks the required permission
        '404':
          description: Not Found - No personas found
        '500':
          description: Server error
      tags:
      - Personas
      operationId: getPersona
      summary: get persona
      x-mint:
        metadata:
          title: get persona
        mcp:
          enabled: true
          name: get-persona
          description: Returns a persona by id
    put:
      description: Update a persona by id
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Persona id
        required: true
      requestBody:
        description: Partial persona update. Only the fields you include are changed; omit a field to leave it unchanged. Changing `avatarId` may reset `avatarModel` if the new avatar doesn't support the previous model; changing `voiceId` resets any existing `voiceGenerationOptions` unless new ones are supplied. `voiceGenerationOptions` sent with the persona's current `voiceId` are merged into the saved options, so a key can't be removed that way; sent without `voiceId`, they replace the saved options; `null` clears them. The resulting options must suit the model the voice generates with, which is the `model` override when one is set.
        required: true
        content:
          application/json:
            examples:
              default:
                $ref: '#/components/examples/PersonaUpdate'
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the persona
                  example: Cara
                description:
                  type: string
                  description: Description of the persona, for example "A helpful assistant". Does not affect the persona's behavior.
                avatarId:
                  type: string
                  description: The avatar to use.
                  example: 071b0286-4cce-4808-bee2-e642f1062de3
                avatarModel:
                  type: string
                  enum:
                  - cara-3
                  - cara-4
                  - cara-4-latest
                  description: Avatar model version. `cara-4` is pinned to a stable checkpoint; `cara-4-latest` tracks the newest Cara 4 checkpoint and may change between sessions.
                  example: cara-4
                voiceId:
                  type: string
                  description: The voice to use.
                  example: de23e340-1416-4dd8-977d-065a7ca11697
                llmId:
                  type: string
                  description: The LLM to use. To disable the LLM, use 'CUSTOMER_CLIENT_V1'.
                  example: a7cf662c-2ace-4de1-a21e-ef0fbf144bb7
                systemPrompt:
                  type: string
                  description: System prompt for the LLM
                  example: You are a helpful assistant
                skipGreeting:
                  type: boolean
                  description: Whether to skip the greeting message when starting a session with this persona.
                  example: false
                uninterruptibleGreeting:
                  type: boolean
                  description: When true, the greeting message cannot be interrupted by the user.
                  example: false
                initialMessage:
                  type: string
                  nullable: true
                  description: Custom first message the persona speaks to open the conversation. If empty or not provided, the persona generates its own greeting.
                  example: Hi there! I'm excited to chat with you today.
                zeroDataRetention:
                  type: boolean
                  description: When true, session data is not stored after the conversation ends
                  example: false
                maxSessionLengthSeconds:
                  type:
                  - integer
                  - 'null'
                  minimum: 60
                  maximum: 7200
                  description: Maximum length in seconds of every session with this persona. It can only shorten the plan's session limit, never extend it. Send `null` to remove it.
                  example: 600
                voiceDetectionOptions:
                  $ref: '#/components/schemas/VoiceDetectionOptions'
                languageCode:
                  type: string
                  description: Supported ISO 639 language code override (including "yue" for Cantonese) for transcription, replaces organisation level settings and multilingual (default) mode.
                  example: en
                voiceGenerationOptions:
                  description: Configuration options for voice generation. Send `null` to clear them.
                  oneOf:
                  - $ref: '#/components/schemas/ElevenLabsV1VoiceGenerationOptions'
                  - $ref: '#/components/schemas/ElevenLabsV2VoiceGenerationOptions'
                  - $ref: '#/components/schemas/ElevenLabsV3VoiceGenerationOptions'
                  - $ref: '#/components/schemas/ElevenLabsV4VoiceGenerationOptions'
                  - $ref: '#/components/schemas/CartesiaSonic3VoiceGenerationOptions'
                  - $ref: '#/components/schemas/FishAudioVoiceGenerationOptions'
                  - type: 'null'
                toolIds:
                  type: array
                  items:
                    type: string
                  description: Array of tool IDs to attach to the persona. Replaces any existing tool associations.
                  example:
                  - tool-id-1
                  - tool-id-2
                widgetConfig:
                  type: object
                  description: Widget configuration overrides. Provided fields are merged into the existing widget configuration; omitted fields are left unchanged.
                  properties:
                    callToAction:
                      type: string
                      description: Call-to-action text shown on the widget launcher.
                      example: Chat with our assistant
                    allowedOrigins:
                      type: array
                      items:
                        type: string
                      description: Origins allowed to embed the widget. Bare domains are normalised to https. Ignored when allowEverywhere is true.
                      example:
                      - https://example.com
                      - https://app.example.com
                    allowEverywhere:
                      type: boolean
                      description: When true, the widget can be embedded on any origin.
                    layout:
                      type: string
                      enum:
                      - inline
                      - floating
                      description: How the widget is rendered on the host page.
                    initialState:
                      type: string
                      enum:
                      - minimized
                      - expanded
                      description: Initial state of a floating widget.
                    position:
                      type: string
                      description: Screen position of a floating widget (e.g. "bottom-right").
                    showTextInput:
                      type: boolean
                      description: Whether the widget shows a text input alongside voice.
                    showMuteButton:
                      type: boolean
                      description: Whether the widget shows a mute button.
                    showTranscript:
                      type: boolean
                      description: Whether the widget shows an expandable conversation transcript during calls. Defaults to true when omitted.
                    showPreviewVideo:
                      type: boolean
                      description: Whether the widget plays the avatar's looping idle video before a call. When false, it shows the avatar's still image instead. Defaults to true when omitted.
              additionalProperties: false
      responses:
        '200':
          description: Successfully updated persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
              examples:
                default:
                  $ref: '#/components/examples/PersonaResponse'
        '400':
          description: Bad request - Invalid persona data, avatarModel not supported by avatar, or an `avatarId`, `voiceId`, `llmId` or `toolIds` entry that is missing, deleted or not available to your organization. Also returned when a change needs the persona's current voice and that voice has been deleted; send a new `voiceId` with the update. Setting a `personaPreset` other than the persona's current one is no longer supported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    description: Machine-readable reason, when one applies (for example `PERSONA_PRESET_UNSUPPORTED`).
              examples:
                presetUnsupported:
                  summary: A persona preset was sent
                  value:
                    error: personaPreset is no longer supported. Set avatarId and voiceId instead.
                    code: PERSONA_PRESET_UNSUPPORTED
                voiceNotFound:
                  summary: The requested voice was deleted or never existed
                  value:
                    error: Voice not found
                currentVoiceDeleted:
                  summary: The persona's current voice was deleted
                  value:
                    error: This persona's voice no longer exists. Set voiceId to an available voice.
        '401':
          description: Unauthorized - Invalid or missing API key
        '403':
          description: Forbidden - Account does not have access or API key lacks the required permission
        '404':
          description: Not Found - Persona not found
        '500':
          description: Server error
      tags:
      - Personas
      operationId: updatePersona
      summary: update persona
      x-mint:
        metadata:
          title: update persona
        mcp:
          enabled: true
          name: update-persona
          description: Update a persona by id
    delete:
      description: Soft-delete a persona owned by the authenticated organization. Missing, already deleted, and other organizations' personas return 404
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: Persona id
        required: true
      responses:
        '200':
          description: Successfully deleted persona
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Persona deleted
        '401':
          description: Unauthorized - Invalid or missing API key
        '403':
          description: Forbidden - Account does not have access or API key lacks the required permission
        '404':
          description: Persona is missing, already deleted, or not owned by this organization
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    example: Persona not found
        '500':
          description: Server error
      tags:
      - Personas
      operationId: deletePersona
      summary: delete persona
      x-mint:
        metadata:
          title: delete persona
        mcp:
          enabled: true
          name: delete-persona
          description: Soft-delete a persona owned by the authenticated organization. Missing, already deleted, and other organizations' personas return 404. Use with caution as this action cannot be undone.
  /v1/personas/{id}/widget:
    get:
      summary: Get persona widget display configuration
      description: Returns saved widget display configuration and avatar media. Origin access controls are omitted. Missing or temporarily unavailable idle previews are null; clients should show avatarImageUrl instead. Preview availability does not indicate whether the avatar can start a call.
      tags:
      - Personas
      security: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Persona ID.
      - in: header
        name: Origin
        schema:
          type: string
        description: Request origin, echoed in the CORS response.
      responses:
        '200':
          description: Widget display configuration. Signed preview URLs expire after one hour.
          headers:
            Cache-Control:
              schema:
                type: string
              description: public, max-age=60, stale-while-revalidate=300
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Request origin, or * when absent.
            Vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                type: object
                required:
                - widgetConfig
                - persona
                properties:
                  widgetConfig:
                    type: object
                    additionalProperties: true
                    description: Saved widget settings, excluding allowedOrigins and allowEverywhere.
                  persona:
                    type: object
                    required:
                    - name
                    - avatarImageUrl
                    - avatarVideoUrl
                    properties:
                      name:
                        type: string
                      avatarImageUrl:
                        type:
                        - string
                        - 'null'
                        description: Landscape still image cropped to match the call's video framing.
                      avatarVideoUrl:
                        type:
                        - string
                        - 'null'
                        description: Verified idle-loop MP4 URL, or null when unavailable. Never a talking preview.
              example:
                widgetConfig: {}
                persona:
                  name: Assistant
                  avatarImageUrl: https://lab.anam.ai/api/avatars/0f3b4c5e-1a2b-4c3d-9e8f-7a6b5c4d3e2f/image/landscape?v=3f2a1b0c9d8e7f6a
                  avatarVideoUrl: null
        '404':
          description: Persona was not found or is deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Persona not found
        '500':
          description: Widget configuration could not be loaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch widget config
      operationId: getPersonaWidget
      x-mint:
        metadata:
          title: get persona widget
        mcp:
          enabled: true
          name: get-persona-widget
          description: Returns saved widget display configuration and avatar media. Origin access controls are omitted. Missing or temporarily unavailable idle previews are null; clients should show avatarImageUrl instead. Preview availability does not indicate whether the avatar can start a call.
components:
  schemas:
    Avatar:
      type: object
      description: A face preset that a persona can use as its visual representation.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the avatar.
        displayName:
          type: string
          description: Human-readable name shown in the Lab and share links.
        variantName:
          type: string
          description: Name of the specific variant (e.g. lighting or pose) within the avatar family.
        imageUrl:
          type: string
          format: uri
          description: Still image of the avatar, framed exactly like `videoUrl`, `idleVideoUrl` and a landscape session (the default). Use it as the thumbnail, poster or loading image wherever a preview video or the live stream replaces it, and give the image and the video the same box, `object-fit` and `object-position` so the avatar doesn't move when they swap. For Cara 4 avatars this is the 1152x768 landscape crop (the same image as `landscapeImageUrl`). Cara 4 avatars used to return their square source image here; that image is now `sourceImageUrl`. Empty when the avatar has no image yet.
        sourceImageUrl:
          type: string
          format: uri
          description: The image the avatar was created from. For Cara 4 avatars it is square (1152x1152) and shows more of the scene than the 1152x768 crop that preview videos and sessions use, so the avatar appears to zoom in when a video or call replaces it. Don't use it as a thumbnail, poster or loading image next to `videoUrl` or a session; use `imageUrl`, `landscapeImageUrl` or `portraitImageUrl`. For legacy avatars it is the same landscape image as `imageUrl`.
        landscapeImageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Still image cropped exactly as the engine frames landscape (1152x768) output, which is also the framing of `videoUrl` and `idleVideoUrl`. Use it with landscape sessions (the default) and preview videos. For avatars with legacy landscape source images this is the source image.
        portraitImageUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Still image cropped exactly as the engine frames portrait (768x1152) output. Use it as the poster for a session started with portrait `videoWidth`/`videoHeight`. Preview videos are landscape, so don't swap this image for `videoUrl`. `null` when the avatar cannot render portrait output.
        videoUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL for a verified muted MP4 preview of the avatar. Uses the idle loop if the talking preview is unavailable. Landscape (1152x768 for Cara 4 avatars, 720x480 for legacy avatars) and framed exactly like `imageUrl`, so pair it with `imageUrl` or `landscapeImageUrl`, not `sourceImageUrl`. The URL expires after 1 hour; re-fetch the avatar to get a fresh URL. `null` when the preview is unavailable or still generating.
        idleVideoUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Signed URL for a muted idling-loop MP4 of the avatar, if one exists. Landscape and framed exactly like `imageUrl`, like `videoUrl`. The URL expires after 1 hour; re-fetch the avatar to get a fresh URL. `null` when unavailable or still generating.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the avatar was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the avatar was last updated.
        createdByOrganizationId:
          type:
          - string
          - 'null'
          description: ID of the organization that created the avatar, or `null` for stock avatars. IDs may be either UUIDs or nanoid-style strings depending on when the organization was created.
        availableVersions:
          type: array
          items:
            type: string
          description: Avatar models this avatar can be used with. Pass one of these values as `avatarModel` when creating a persona or starting a session.
        activeVersion:
          type:
          - string
          - 'null'
          description: Avatar model used by default when no explicit `avatarModel` is requested.
        description:
          type:
          - string
          - 'null'
          description: AI-generated description of the avatar's appearance, setting, and style. `null` if metadata generation has not completed.
        displayTags:
          type: array
          items:
            type: string
          description: Curated tags describing the avatar. Empty array if metadata generation has not completed.
        renderStyle:
          type: string
          enum:
          - realistic
          - animated_3d
          - illustrated
          - unknown
          description: Render style of the avatar. `unknown` covers custom avatars and avatars whose metadata has not yet been generated.
    ElevenLabsV3VoiceGenerationOptions:
      title: ElevenLabs V3
      type: object
      additionalProperties: false
      description: Voice generation options for an eleven_v3 or eleven_v3_conversational voice, or for any voice whose model override is one of them. Only stability is supported.
      properties:
        stability:
          type: number
          description: Controls how stable the generated voice is, from 0 (more varied) to 1 (more stable).
          example: 0.5
          minimum: 0
          maximum: 1
        model:
          $ref: '#/components/schemas/ElevenLabsModelOverride'
    Voice:
      type: object
      description: A voice preset a persona can use for text-to-speech.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the voice.
        displayName:
          type: string
          description: Human-readable name shown in the Lab.
        provider:
          type: string
          enum:
          - CARTESIA
          - ELEVENLABS
          - FISH_AUDIO
          description: Upstream TTS provider for this voice.
        providerVoiceId:
          type:
          - string
          - 'null'
          description: The upstream provider's identifier for the voice.
        providerModelId:
          type:
          - string
          - 'null'
          description: The upstream provider's model identifier used to generate speech.
        sampleUrl:
          type:
          - string
          - 'null'
          format: uri
          description: URL of a short audio preview of the voice.
        previewSampleUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Alias for `sampleUrl`, kept for backwards compatibility.
        gender:
          type:
          - string
          - 'null'
          enum:
          - MALE
          - FEMALE
          - NEUTRAL
          - null
          description: Perceived gender of the voice, if categorised.
        country:
          type:
          - string
          - 'null'
          description: ISO 3166-1 alpha-2 country code representing the voice's accent.
        description:
          type:
          - string
          - 'null'
          description: Free-form description of the voice's character.
        displayTags:
          type: array
          items:
            type: string
          description: Tags used to categorise the voice in the Lab UI.
        isZdr:
          type: boolean
          description: Whether this voice meets the Zero Data Retention requirements.
        createdByOrganizationId:
          type:
          - string
          - 'null'
          description: ID of the organization that created the voice, or `null` for stock voices. IDs may be either UUIDs or nanoid-style strings depending on when the organization was created.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the voice was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the voice was last updated.
    ElevenLabsV1VoiceGenerationOptions:
      title: ElevenLabs V1
      type: object
      description: Voice generation options for ElevenLabs V1 models.
      properties:
        stability:
          type: number
          description: Controls how stable the generated voice is between each generation, between 0 (more varied/higher emotional range) and 1 (more stable/less emotional range).
          example: 0.5
          minimum: 0
          maximum: 1
        similarityBoost:
          type: number
