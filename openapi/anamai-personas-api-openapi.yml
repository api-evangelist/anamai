    VoiceDetectionOptions:
      type: object
      description: Options for voice activity detection during user speech input.
      properties:
        endOfSpeechSensitivity:
          type: number
          description: Sensitivity for detecting end of speech, between 0 (least sensitive) and 1 (most sensitive).
          example: 0.5
          minimum: 0
          maximum: 1
        silenceBeforeSkipTurnSeconds:
          type: number
          description: Duration of silence (in seconds) before the current user turn is skipped.
          example: 5
          minimum: 0
          maximum: 900
        silenceBeforeSessionEndSeconds:
          type: number
          description: Duration of silence (in seconds) before the session is automatically ended.
          example: 60
          minimum: 0
          maximum: 7200
        silenceBeforeAutoEndTurnSeconds:
          type: number
          description: Duration of silence (in seconds) before the user turn is automatically ended.
          example: 5
          minimum: 0.5
          maximum: 10
        speechEnhancementLevel:
          type: number
          description: Level of speech enhancement to apply, 0 (no speech enhancement) 1 (max speech enhancement)
          example: 0.8
          minimum: 0
          maximum: 1
        sttProvider:
          type: string
          enum:
          - anam
          - deepgram
          - cartesia_ink_2
          - inworld_stt_1
          description: 'Speech-to-text provider to use. Defaults to the platform default when unset. The deepgram provider supports only these languageCode values: en, es, fr, de, hi, ru, pt, ja, it, nl. The cartesia_ink_2 provider supports only these languageCode values: en. The inworld_stt_1 provider supports only these languageCode values: ar, yue, zh, cs, da, nl, en, tl, fi, fr, de, el, hi, hu, id, it, ja, ko, mk, ms, fa, pl, pt, ro, ru, es, sv, th, tr, vi. The inworld_stt_1 provider cannot be used when zeroDataRetention is true. The inworld_stt_1 provider processes audio only in us, so it cannot be used when sessionOptions.regionPolicy is "strict" with any other region.'
